<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:350px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
background:#2563eb;
color:white;
border:none;
}

.error{
color:red;
}

</style>
</head>

<body>

<div class="box">

<h2>Cyber Threat Detection Login</h2>

<form action="/login" method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</div>

</body>
</html>
